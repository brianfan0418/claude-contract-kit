<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>合約管理</title><link rel="stylesheet" href="app.css"></head>
<body><a class="skip" href="#main">跳至合約主區</a><div class="app">
<aside id="sidebar" class="sidebar" aria-label="檢視與篩選"><div class="brand" id="brand" hidden></div><nav id="collections" aria-label="合約與案件"></nav><h2 class="side-title">預設檢視</h2><nav id="views" aria-label="預設檢視"></nav><h2 class="side-title">篩選</h2><div id="filters"></div><button type="button" id="reset">清除篩選</button></aside>
<div id="sidebar-resize" class="resize-handle" role="separator" tabindex="0" aria-label="調整側欄寬度" aria-orientation="vertical" aria-controls="sidebar"></div><div class="workspace"><header class="topbar"><button id="sidebar-toggle" class="icon mobile-toggle" type="button" data-icon="menu" aria-label="開啟導覽" aria-expanded="false" aria-controls="sidebar"></button><h1>合約管理</h1><input id="search" class="search" type="search" placeholder="搜尋合約與案件" aria-label="搜尋合約與案件"><button id="connect" type="button">連接資料夾</button><label class="user-label">處理人<input id="user" list="actors" aria-label="處理人姓名" placeholder="姓名" size="8"></label><datalist id="actors"></datalist><div class="preferences"><button id="font-down" class="icon" type="button" aria-label="縮小文字" title="縮小文字"></button><span class="zoom-label" id="zoom-label"></span><button id="font-up" class="icon" type="button" aria-label="放大文字" title="放大文字"></button><button id="theme" class="icon" type="button"></button></div></header>
<main class="content" id="main" tabindex="-1"><div class="notice" id="notice" role="status" hidden></div><div class="tablebar"><h2 id="view-title">合約庫</h2><span id="count" class="muted" aria-live="polite"></span><div class="actions"><button id="columns" type="button" aria-haspopup="dialog" aria-controls="column-editor">欄位</button><button id="new-contract" type="button" disabled>新增合約</button><button id="new-case" class="primary" type="button" disabled>新增案件</button><button id="refresh" class="icon" type="button" aria-label="重新載入" title="重新載入"></button></div></div><div class="tablewrap" tabindex="0" aria-label="合約表格，可水平與垂直捲動"><table id="table" aria-label="合約主檔"><thead></thead><tbody></tbody></table></div></main></div></div>
<aside class="drawer" id="drawer" aria-label="合約與案件明細" hidden><div id="drawer-resize" class="resize-handle drawer-resize" role="separator" tabindex="0" aria-label="調整明細寬度" aria-orientation="vertical" aria-controls="drawer"></div><header class="drawer-head"><div><p class="muted" id="detail-id"></p><h2 id="detail-title"></h2></div><div class="buttons"><button id="edit" type="button" disabled>編輯</button><button id="close" class="icon" type="button" aria-label="關閉明細" title="關閉明細"></button></div></header><div class="drawer-body" id="detail-body"></div></aside>
<dialog id="column-editor" aria-labelledby="columns-title"><header class="dialog-head"><h2 id="columns-title">顯示欄位</h2></header><div id="column-list" class="column-list"></div><footer class="dialog-foot"><button id="columns-reset" type="button">恢復預設</button><button id="columns-close" type="button">取消</button><button id="columns-apply" type="button" class="primary">套用</button></footer></dialog>
<dialog id="editor" aria-labelledby="editor-title"><form id="record-form"><header class="dialog-head"><h2 id="editor-title">新增案件</h2><button id="cancel-top" class="icon" type="button" aria-label="關閉表單"></button></header><div id="form-fields" class="form-fields"></div><p id="form-error" class="form-error" role="alert"></p><footer class="dialog-foot"><button id="cancel" type="button">取消</button><button id="save" class="primary" type="submit">儲存</button></footer></form></dialog><script src="preferences.js"></script><script src="data/data.js"></script><script src="datasource.js"></script><script src="review-data.js"></script><script src="review.js"></script><script src="table-model.js"></script><script src="app.js"></script></body></html>
