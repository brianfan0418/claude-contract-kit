steps:
  - id: test
    name: node:22-bookworm
    entrypoint: bash
    args:
      - -ceu
      - |
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends python3 python3-venv
        python3 -m venv /tmp/contract-kit-ci-venv
        . /tmp/contract-kit-ci-venv/bin/activate
        pip install -r dashboard/requirements-word.txt
        cd dashboard
        npm ci
        cd ..
        python3 -m unittest discover -s . -v
        node dashboard/test_datasource.js
timeout: 1200s
options:
  logging: CLOUD_LOGGING_ONLY
